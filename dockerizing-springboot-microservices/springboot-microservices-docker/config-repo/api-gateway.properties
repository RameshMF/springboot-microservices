spring.application.name=api-gateway

server.port=9191

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# route ID
# route URI
# route predicate

# department-service
spring.cloud.gateway.server.webmvc.routes[0].id=department-service-route
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://department-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/departments/**

# employee-service
spring.cloud.gateway.server.webmvc.routes[1].id=employee-service-route
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://employee-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/employees/**

# organization-service
spring.cloud.gateway.server.webmvc.routes[2].id=organization-service-route
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://organization-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/organizations/**